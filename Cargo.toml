[package]
name = "student_performance"
version = "0.1.0"
edition = "2021"

[dependencies]
# reading CSV files
csv = "1.1"
# deserializing CSV into structs
serde = { version = "1.0", features = ["derive"] }
# numerical arrays
ndarray = "0.15"
# machine learning framework
linfa = "0.7"
linfa-trees = "0.7"
# graph algorithms and BFS/DFS
petgraph = "0.6"
# For testing and shuffling data (used in accuracy eval)
rand = "0.8"
